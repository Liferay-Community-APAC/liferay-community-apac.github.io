# Publishes the site to GitHub Pages with a Pagefind search index.
# In Settings → Pages, set "Source" to "GitHub Actions" for this to take over from branch publishing.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copy the site
        run: rsync -a --exclude .git --exclude .github --exclude _site ./ _site/

      - name: Build the search index
        run: npx --yes pagefind@1.3.0 --site _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
