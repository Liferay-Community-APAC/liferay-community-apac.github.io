name: Ask for help
description: Get help installing, using or running a Marketplace App, tutorial, recipe or tool from Liferay Community APAC.
title: "[Help] "
labels: ["help wanted", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reaching out. Members of Liferay Community APAC answer requests here on a best-effort basis.

        **This is a public page.** Don't post passwords, keys, customer data or anything confidential.
        For official support with a Liferay subscription, use the [Liferay Help Center](https://help.liferay.com/) instead.
  - type: dropdown
    id: about
    attributes:
      label: What do you need help with?
      options:
        - Liferay Forums (Marketplace App)
        - Solution Recipes
        - "Tutorial: Native iOS app on Liferay DXP"
        - "Tutorial: SharePoint Online to Liferay DXP migration"
        - "Tutorial: Liferay DXP self-hosted on Amazon EC2"
        - "Sample code: Sample workspace for Liferay DXP on EC2"
        - "Tool: Liferay upgrade report script"
        - The Liferay Community APAC website
        - Something else
    validations:
      required: true
  - type: input
    id: other
    attributes:
      label: If something else, what is it?
      placeholder: A link or name is enough.
  - type: input
    id: dxp
    attributes:
      label: Liferay DXP version
      description: Shown in Control Panel → Server Administration, or in the bundle's name.
      placeholder: e.g. 2026.Q1.3 LTS
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: Where does Liferay DXP run?
      options:
        - Liferay Self-Hosted
        - Liferay PaaS
        - Liferay SaaS
        - Local development only
        - Not sure
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: The outcome you're after, in a sentence or two.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Paste only the lines around the error. They're formatted as code automatically.
      render: shell
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Guide pages you followed, settings you changed, anything you've ruled out.
  - type: dropdown
    id: urgency
    attributes:
      label: How is this affecting you?
      options:
        - Blocking a production site
        - Blocking a project or go-live
        - Slowing me down
        - Just curious
  - type: checkboxes
    id: public
    attributes:
      label: Before you submit
      description: Everything you post here is public, and community help is best effort.
      options:
        - label: I removed passwords, keys, tokens, customer data, internal hostnames and anything else confidential from this request, including logs and screenshots.
          required: true
        - label: I understand this is community help on a best-effort basis, not official Liferay support.
          required: true
